import com.diffplug.blowdryer.Blowdryer

import java.nio.file.Files
import java.nio.file.Paths

plugins {
  id 'java'
  id 'application'
  id 'idea'
  id 'eclipse'
  id 'maven-publish'
  id 'com.diffplug.spotless' version '6.7.2' apply false
  id 'com.palantir.git-version' version '0.13.0' apply false // 0.13.0 is the last jvm8 supporting version
}

boolean disableSpotless = false
boolean apiPackage = false
String modrinthProjectId = "Ic2ExpReactorPlanner"

if (project.file('.git/HEAD').isFile()) {
    apply plugin: 'com.palantir.git-version'
}

project.extensions.add(Blowdryer, "Blowdryer", Blowdryer)
if (!disableSpotless) {
    apply plugin: 'com.diffplug.spotless'
    apply from: Blowdryer.file('spotless.gradle')
}

sourceCompatibility = '1.8'
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

// NetBeans will automatically add "run" and "debug" tasks relying on the
// "mainClass" property. You may however define the property prior executing
// tasks by passing a "-PmainClass=<QUALIFIED_CLASS_NAME>" argument.
//
// Note however, that you may define your own "run" and "debug" task if you
// prefer. In this case NetBeans will not add these tasks but you may rely on
// your own implementation.
if (!hasProperty('mainClass')) {
    ext.mainClass = 'Ic2ExpReactorPlanner.ReactorPlannerFrame'
}

mainClassName = ext.mainClass

sourceSets {
  main {
    java {
      srcDirs 'src'
    }
    resources {
      srcDir 'resources'
    }
  }

  test {
    java {
      srcDir 'test'
    }
    resources {
      srcDir 'testResources'
    }
  }
}

repositories {
    mavenCentral()
    // You may define additional repositories, or even remove "mavenCentral()".
    // Read more about repositories here:
    //   http://www.gradle.org/docs/current/userguide/dependency_management.html#sec:repositories
}

dependencies {
    // JUnit 5 regression suite for the calculation + simulation logic. See CODE_REVIEW.md.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    from('src') {
        include 'assets/**/*.png'
        include 'Ic2ExpReactorPlanner/Bundle*.properties'
    }
    manifest {
        attributes 'Main-Class': 'Ic2ExpReactorPlanner.ReactorPlannerFrame'
    }
}

// Fix Jenkins' Git: chmod a file should not be detected as a change and append a '.dirty' to the version
try {
    'git config core.fileMode false'.execute()
}
catch (Exception ignored) {
    out.style(Style.Failure).println("git isn't installed at all")
}

// Pulls version first from the VERSION env and then git tag
String identifiedVersion
String versionOverride = System.getenv("VERSION") ?: null
try {
    identifiedVersion = versionOverride == null ? gitVersion() : versionOverride
}
catch (Exception ignored) {
    out.style(Style.Failure).text(
        'This mod must be version controlled by Git AND the repository must provide at least one tag,\n' +
            'or the VERSION override must be set! ').style(Style.SuccessHeader).text('(Do NOT download from GitHub using the ZIP option, instead\n' +
        'clone the repository, see ').style(Style.Info).text('https://gtnh.miraheze.org/wiki/Development').style(Style.SuccessHeader).println(' for details.)'
    )
    versionOverride = 'NO-GIT-TAG-SET'
    identifiedVersion = versionOverride
}
version = identifiedVersion
ext {
    modVersion = identifiedVersion
}

if (identifiedVersion == versionOverride) {
    out.style(Style.Failure).text('Override version to ').style(Style.Identifier).text(modVersion).style(Style.Failure).println('!\7')
}

task processAssets(type: Copy) {
    from('src') {
        include 'assets/**/*.png'
        include 'Ic2ExpReactorPlanner/Bundle*.properties'
    }
    into 'build/classes/java/main'
}

// Regression suite: JUnit 5, headless. Covers component calculation logic, the tick
// simulation loop, and reactor code serialization. Bundles/textures live under src/,
// which is a *java* srcDir, so processAssets is what puts them on the test classpath.
tasks.named('test', Test) {
    useJUnitPlatform()
    dependsOn processAssets
    // processAssets writes into the main classes dir, which compileTestJava consumes.
    dependsOn tasks.named('compileTestJava')
    systemProperty 'java.awt.headless', 'true'
    // Opt-in regeneration of testResources/corpus-baseline.txt:
    //   ./gradlew test -Derp.writeBaseline=true
    // Only this property is forwarded; the rest of the Gradle JVM env is not leaked into tests.
    String writeBaseline = System.getProperty('erp.writeBaseline');
    if (writeBaseline != null) {
        systemProperty 'erp.writeBaseline', writeBaseline
    }
    maxHeapSize = '1g'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = false
    }
}

run {
    run.dependsOn processAssets
}

task processSource(type: Copy) {
    from sourceSets.main.java
    inputs.property 'erpVersion', erpVersion
    filter { line -> line.replaceAll('@VERSION@', erpVersion) }
    into "$buildDir/src"
}

compileJava {
    source = processSource.outputs
}

publishing {
    publications {
        create("maven", MavenPublication) {
            from components.java

            if (apiPackage) {
                artifact apiJar
            }

            groupId = System.getenv("ARTIFACT_GROUP_ID") ?: "com.github.GTNewHorizons"
            artifactId = System.getenv("ARTIFACT_ID") ?: project.name
            // Using the identified version, not project.version as it has the prepended 1.7.10
            version = System.getenv("RELEASE_VERSION") ?: identifiedVersion
        }
    }

    repositories {
        maven {
            url = "http://jenkins.usrv.eu:8081/nexus/content/repositories/releases"
            allowInsecureProtocol = true
            credentials {
                username = System.getenv("MAVEN_USER") ?: "NONE"
                password = System.getenv("MAVEN_PASSWORD") ?: "NONE"
            }
        }
    }
}


// Web preview: the green Run button. The server itself stays tools/serve.mjs so a terminal and the
// button cannot drift apart.
//
// Everything happens in `doLast`. That is not style: a statement inside a task's configuration
// closure runs during *configuration*, which is every Gradle invocation, so the first version of
// this task started a server and then blocked on it for `gradlew help`, `gradlew build`, and every
// IDE sync. `./gradlew help --offline` was measured starting it and hanging until interrupted.
tasks.register('webPreview') {
    group = 'web'
    description 'Serve the repository and open web/ui/ in the default browser; the log goes to web-preview.log.'

    doLast {
        def script = file('tools/serve.mjs').absolutePath
        if (!file('tools/serve.mjs').exists()) {
            logger.lifecycle('tools/serve.mjs is missing — nothing to serve')
            return
        }

        // One press, one server. `--stop` ends whatever an earlier press left behind, and it only
        // kills a PID whose command line is this script (a stranger on 8123 is reported, not
        // murdered).
        def stop = new ProcessBuilder('node', script, '--stop').redirectErrorStream(true).start()
        stop.inputStream.text
        stop.waitFor()

        // `--die-with-parent` is belt and braces: the child's stdin is a pipe this JVM holds, so the
        // daemon exiting ends the server even if nothing below runs.
        // A headless machine (and the probes) can run the same task without a browser:
        // `./gradlew webPreview -PwebPreviewOpen=false`.
        def launch = ['node', script, '--die-with-parent', '--log', 'web-preview.log']
        if (project.findProperty('webPreviewOpen') != 'false') launch << '--open'
        def server = new ProcessBuilder(launch).redirectErrorStream(true).start()

        // The Run console shows what Gradle logs as the build proceeds, so the child's lines are
        // forwarded rather than left in web-preview.log. A daemon thread, because the reader blocks
        // on the pipe for as long as the server lives.
        def pump = new Thread({
            server.inputStream.eachLine { line -> logger.lifecycle(line) }
        }, 'web-preview-output')
        pump.daemon = true
        pump.start()

        def handle = server.toHandle()
        def takeDown = {
            // Descendants too: `node --open` may have started a browser, and a killed Gradle build
            // must not leave either behind.
            handle.descendants().each { it.destroyForcibly() }
            handle.destroyForcibly()
            handle.onExit().get(10, java.util.concurrent.TimeUnit.SECONDS)
        }

        try {
            // Not `waitFor()`. A build that is cancelled has to be able to act on it, and a bare
            // waitFor() swallows the interruption until the child exits -- which for a server is
            // never, so the Stop button would hang instead of stopping. Polling for a quarter of a
            // second costs nothing and lets the cancel path below run.
            while (!server.waitFor(250, java.util.concurrent.TimeUnit.MILLISECONDS)) {
                // A cancelled build arrives as an interrupt on this thread.
                if (Thread.currentThread().isInterrupted()) {
                    throw new InterruptedException('the run was stopped')
                }
            }
            if (server.exitValue() != 0) {
                logger.lifecycle("the preview server exited with ${server.exitValue()} — see web-preview.log")
            }
        } catch (InterruptedException stopped) {
            logger.lifecycle('stopping the preview server with the run')
            takeDown()
            Thread.currentThread().interrupt()
        } finally {
            // Every other way out of a build (an exception in another task, a killed daemon, a
            // crash) lands here, and none of them should leave a listener behind.
            if (server.isAlive()) takeDown()
        }
    }
}

// The server is a child of the Gradle daemon rather than of the run, so a Stop that Gradle does not
// report as a cancel can leave it listening. This is the explicit escape hatch.
tasks.register('webStop') {
    group = 'web'
    description 'Stop the preview server listening on 8123.'

    doLast {
        def stop = new ProcessBuilder('node', file('tools/serve.mjs').absolutePath, '--stop')
            .redirectErrorStream(true)
            .start()
        stop.inputStream.eachLine { line -> logger.lifecycle(line) }
        if (stop.waitFor() != 0) {
            logger.lifecycle('the preview server is still there — stop it yourself')
        }
    }
}

